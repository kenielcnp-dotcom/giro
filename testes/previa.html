<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Giro - previa dos Relatorios</title>

  <!--
    Previa da tela de Relatorios com dados de exemplo, sem login.

      python -m http.server 8765        (na pasta do projeto)
      http://localhost:8765/testes/previa.html
      ...?tema=escuro  ...?cenario=vazio|erro|um-dia|so-despesa|offline|lento

    O import map troca /src/dados.js por testes/dados-de-exemplo.js; todo
    o resto -- tela, graficos, contas e CSS -- e o codigo real do app.
    Fica fora do deploy (ver .vercelignore).
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">

  <script>
    var tema = new URLSearchParams(location.search).get('tema');
    if (tema) document.documentElement.setAttribute('data-tema', tema);
  </script>

  <link rel="stylesheet" href="/src/styles/tokens.css">
  <link rel="stylesheet" href="/src/styles/app.css">
  <link rel="stylesheet" href="/src/styles/componentes.css">

  <script type="importmap">
  {
    "imports": {
      "/src/dados.js": "/testes/dados-de-exemplo.js"
    }
  }
  </script>
</head>
<body>
  <div id="raiz">
    <div id="tela"></div>
    <!-- Copia estatica da barra de abas do router.js, so para conferir o visual. -->
    <nav class="abas" aria-label="Navegacao principal">
      <button type="button" class="aba" aria-current="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
        <span>Inicio</span>
      </button>
      <button type="button" class="aba" aria-current="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19V10"/><path d="M10 19V5"/><path d="M16 19v-6"/><path d="M22 19H2"/></svg>
        <span>Financas</span>
      </button>
      <button type="button" class="aba" aria-current="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 17h14M4 17l1.6-5.2A2 2 0 0 1 7.5 10h9a2 2 0 0 1 1.9 1.8L20 17"/>
          <circle cx="7.5" cy="17.5" r="1.6"/><circle cx="16.5" cy="17.5" r="1.6"/></svg>
        <span>Carro</span>
      </button>
      <button type="button" class="aba" aria-current="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c0-3.3 3.1-5.5 7-5.5s7 2.2 7 5.5"/></svg>
        <span>Perfil</span>
      </button>
    </nav>
  </div>

  <script type="module">
    import { telaRelatorios } from '/src/telas/relatorios.js';
    telaRelatorios(document.querySelector('#tela'), {
      ir: (destino) => console.log('[previa] ir para', destino),
    });
  </script>
</body>
</html>
